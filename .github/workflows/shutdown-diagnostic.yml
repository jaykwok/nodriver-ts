name: Windows shutdown diagnostic
# Reproduce the released-browser cleanup path on the hosted Windows image. Each
# iteration has its own report; stop on the first failure without retrying it.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Number of independent browser lifetimes (1-50)
        default: '20'
        required: true
permissions:
  contents: read
jobs:
  shutdown:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - run: npm ci
      - run: npm run build
      - name: Record versions and repeat the original acceptance
        env:
          DIAGNOSTIC_REPEATS: ${{ inputs.repeats }}
        run: |
          $count = 0
          if (-not [int]::TryParse($env:DIAGNOSTIC_REPEATS, [ref]$count) -or $count -lt 1 -or $count -gt 50) { throw 'repeats must be 1-50' }
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          node test/ci-versions.ts | Tee-Object test-results/versions.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($iteration = 1; $iteration -le $count; $iteration++) {
            $env:NODRIVER_RAW_SESSION_REPORT = "test-results/shutdown-$iteration.json"
            node test/node-raw-session.mjs 2>&1 | Tee-Object "test-results/shutdown-$iteration.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-shutdown-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
