name: Release
# Publishes to npm when a v<version> tag is pushed. Authentication uses npm trusted publishing
# (OIDC) when it is configured for this workflow, otherwise the NPM_TOKEN secret. Either way the
# package carries a provenance statement linking it to this repository and commit.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODRIVER_HEADFUL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      # The browser suites already ran on this commit in the regression workflow; repeat the fast
      # checks here and test the built package that is about to be published.
      - run: npm test
      - run: npm run test:dist
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
