name: Release
# Publishes to npm when a v<version> tag is pushed. Authentication is npm trusted publishing (OIDC)
# configured for this workflow; no token is stored. The package carries a provenance statement
# linking it to this repository and commit.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODRIVER_HEADFUL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      # Both stable workflows must pass on this commit. The latest run of each workflow counts;
      # publication waits for every other run on the commit, including tag-triggered regression.
      - name: All CI passed on this commit
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 60); do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/release-checks.json"
            state=$(node test/release-gate.ts "$GITHUB_SHA" "$RUNNER_TEMP/release-checks.json")
            if [ "$state" = pass ]; then exit 0; fi
            if [ "$state" = fail ]; then break; fi
            sleep 60
          done
          echo "::error::All CI must complete successfully, including browser regression and the platform matrix, on $GITHUB_SHA"
          exit 1
      - run: npm ci
      - name: Disable piped core dumps for crash acceptance
        run: sudo sysctl -w kernel.core_pattern=core
      # The browser suites ran in the regression workflow; repeat the fast checks here and test
      # the built package that is about to be published.
      - run: npm test
      - run: npm run test:dist
      - run: npm publish --provenance --access public
