name: Release
# Publishes to npm when a v<version> tag is pushed. Authentication is npm trusted publishing (OIDC)
# configured for this workflow; no token is stored. The package carries a provenance statement
# linking it to this repository and commit.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODRIVER_HEADFUL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      # Publish only a commit on which the browser regression workflow passed. Waits while a run
      # for this commit (including the one this tag push started) is still in progress.
      - name: Regression passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 60); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" --json status,conclusion \
              --jq 'if any(.[]; .conclusion == "success") then "pass" elif any(.[]; .status != "completed") then "wait" else "fail" end')
            if [ "$state" = pass ]; then exit 0; fi
            if [ "$state" = fail ]; then break; fi
            sleep 60
          done
          echo "::error::Browser regression has not passed on $GITHUB_SHA"
          exit 1
      - run: npm ci
      - name: Disable piped core dumps for crash acceptance
        run: sudo sysctl -w kernel.core_pattern=core
      # The browser suites ran in the regression workflow; repeat the fast checks here and test
      # the built package that is about to be published.
      - run: npm test
      - run: npm run test:dist
      - run: npm publish --provenance --access public
