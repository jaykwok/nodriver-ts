name: Platform matrix
# Platforms and browsers outside the per-push regression. Run on demand: macOS minutes are billed
# at a higher rate. Each suite runs once without retry so the logs show first-attempt behaviour.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The hosted macOS VM cannot resolve mDNS (.local) host candidates, so local WebRTC
          # never leaves ICE "new"; expose plain host addresses to the test browser instead.
          - name: macos-arm64-chrome
            os: macos-latest
            webrtc-args: --disable-features=WebRtcHideLocalIpsWithMdns
          - name: linux-arm64-chrome
            os: ubuntu-24.04-arm
            chrome: stable
          - name: windows-edge
            os: windows-latest
            edge: true
          - name: linux-chrome-154
            os: ubuntu-latest
            chrome: '154.0.8037.92'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      NODRIVER_HEADFUL: '0'
      NODRIVER_WEBRTC_ARGS: ${{ matrix.webrtc-args }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # See test.yml: systemd-coredump delays renderer-crash reports.
      - name: Disable piped core dumps
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Chrome for Testing
        if: matrix.chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome }}
          install-dependencies: true
      # Ubuntu restricts unprivileged user namespaces through AppArmor, which leaves an unpackaged
      # Chrome without a usable sandbox. Lift the restriction instead of passing --no-sandbox.
      - name: Use Chrome for Testing
        if: matrix.chrome
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Use Edge
        if: matrix.edge
        shell: bash
        run: echo 'CHROME_PATH=C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' >> "$GITHUB_ENV"
      - run: npm ci
      - name: Record versions
        shell: bash
        run: |
          mkdir -p test-results
          node test/ci-versions.ts | tee test-results/versions.txt
          { echo '### Versions'; echo '```'; cat test-results/versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Node.js unit tests
        shell: bash
        run: npm test 2>&1 | tee test-results/node-unit.log
      - name: Node.js integration tests
        if: success() || failure()
        shell: bash
        run: npm run test:integration 2>&1 | tee test-results/node-integration.log
      - name: Node.js compatibility tests
        if: success() || failure()
        shell: bash
        run: npm run test:compat 2>&1 | tee test-results/node-compat.log
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          { echo '### Failed tests'; echo '```'
            for log in test-results/*.log; do
              node test/ci-failures.ts "$log" | sed "s|^|$(basename "$log" .log): |"
            done
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-logs-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
