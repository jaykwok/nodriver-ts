name: Platform matrix
# Platforms and browsers outside the per-push regression. Run on demand: macOS minutes are billed
# at a higher rate. Each suite runs once without retry so the logs show first-attempt behaviour.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The hosted macOS VM cannot resolve mDNS (.local) host candidates, so local WebRTC
          # never leaves ICE "new"; expose plain host addresses to the test browser instead.
          - name: macos-arm64-chrome
            os: macos-latest
            webrtc-args: --disable-features=WebRtcHideLocalIpsWithMdns
          - name: linux-arm64-chrome
            os: ubuntu-24.04-arm
            chrome: stable
          - name: windows-edge
            os: windows-latest
            edge: true
          # Resolved below to the major version before the current stable Chrome for Testing.
          - name: linux-chrome-previous
            os: ubuntu-latest
            chrome: previous
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NODRIVER_HEADFUL: '0'
      NODRIVER_WEBRTC_ARGS: ${{ matrix.webrtc-args }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          cache: npm
      # See test.yml: systemd-coredump delays renderer-crash reports.
      - name: Disable piped core dumps
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Install native environment test locales
        if: runner.os == 'Linux'
        run: sudo locale-gen fr_FR.UTF-8
      - name: Resolve the previous Chrome major
        if: matrix.chrome == 'previous'
        id: previous
        shell: bash
        run: |
          stable=$(curl -fsSL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json |
            node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).channels.Stable.version")
          major=${stable%%.*}
          case "$major" in '' | *[!0-9]*) echo "::error::Unexpected stable version: $stable"; exit 1 ;; esac
          echo "Stable Chrome for Testing is $stable; installing milestone $((major - 1))"
          echo "milestone=$((major - 1))" >> "$GITHUB_OUTPUT"
      - name: Chrome for Testing
        if: matrix.chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ steps.previous.outputs.milestone || matrix.chrome }}
          install-dependencies: true
      # Ubuntu restricts unprivileged user namespaces through AppArmor, which leaves an unpackaged
      # Chrome without a usable sandbox. Lift the restriction instead of passing --no-sandbox.
      - name: Use Chrome for Testing
        if: matrix.chrome
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Use Edge
        if: matrix.edge
        shell: bash
        run: echo 'CHROME_PATH=C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' >> "$GITHUB_ENV"
      - run: npm ci
      - name: Record versions
        shell: bash
        run: |
          mkdir -p test-results
          node test/ci-versions.ts | tee test-results/versions.txt
          { echo '### Versions'; echo '```'; cat test-results/versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Windows runners occasionally leave a browser running after close(); record every close.
      - name: Close diagnostics
        id: diagnostics
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "directory=$(node -p "require('node:path').resolve('test-results/close-diagnostics')")" >> "$GITHUB_OUTPUT"
          echo "import=--import=$(node -p "require('node:url').pathToFileURL('test/ci-close-diagnostics.ts').href")" >> "$GITHUB_OUTPUT"
      - name: Node.js unit tests
        shell: bash
        env:
          NODE_OPTIONS: ${{ steps.diagnostics.outputs.import }}
          NODRIVER_CLOSE_DIAGNOSTICS: ${{ steps.diagnostics.outputs.directory }}
        run: npm test 2>&1 | tee test-results/node-unit.log
      - name: Node.js integration tests
        if: success() || failure()
        shell: bash
        env:
          NODE_OPTIONS: ${{ steps.diagnostics.outputs.import }}
          NODRIVER_CLOSE_DIAGNOSTICS: ${{ steps.diagnostics.outputs.directory }}
        run: npm run test:integration 2>&1 | tee test-results/node-integration.log
      - name: Node.js compatibility tests
        if: success() || failure()
        shell: bash
        env:
          NODE_OPTIONS: ${{ steps.diagnostics.outputs.import }}
          NODRIVER_CLOSE_DIAGNOSTICS: ${{ steps.diagnostics.outputs.directory }}
        run: npm run test:compat 2>&1 | tee test-results/node-compat.log
      # Setup can fail before any log exists; a log that cannot be read is named, and the code
      # block is always closed.
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          { echo '### Failed tests'; echo '```'
            found=0
            for log in test-results/*.log; do
              [ -f "$log" ] || continue
              found=1
              name=$(basename "$log" .log)
              node test/ci-failures.ts "$log" | sed "s|^|$name: |" || echo "$name: failed tests could not be read"
            done
            [ "$found" = 1 ] || echo 'No test log: the job failed before the suites ran. See the step logs.'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-logs-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
