name: Browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      NODRIVER_HEADFUL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      # Linux runs a pinned Chrome for Testing (the version verified under WSL) instead of the
      # runner image's google-chrome, whose renderer-crash reporting differs.
      - name: Chrome for Testing
        if: runner.os == 'Linux'
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '155.0.8059.79'
          install-dependencies: true
      - name: Use Chrome for Testing
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun run test
      # Real-browser tests depend on runner timing; retry once before failing the job.
      - name: Integration tests
        shell: bash
        run: bun run test:integration || (echo "::warning::integration retry" && bun run test:integration)
      - run: bun run build
      # Informational only: does the runner image's own google-chrome report renderer crashes?
      - name: Renderer crash with system google-chrome (informational)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: CHROME_PATH="$(command -v google-chrome)" bun test --timeout 60000 ./test/integration/recovery.test.ts -t "renderer crash"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run test:node
