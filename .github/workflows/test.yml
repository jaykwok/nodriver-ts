name: Browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  guardian-macos:
    name: Supervised lifecycle (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 --test-timeout=60000 test/unit/guardian.test.ts test/unit/guardian-lifecycle.test.ts test/integration/supervised.test.ts
      - name: Input lifecycle and composition
        run: node --test --test-concurrency=1 --test-timeout=60000 test/unit/behavior.test.ts test/unit/input-lifecycle.test.ts test/unit/composition.test.ts test/integration/behavior.test.ts test/integration/composition.test.ts
      - name: Presentation leases
        run: node --test --test-concurrency=1 --test-timeout=60000 test/unit/presentation.test.ts test/integration/presentation.test.ts
      - run: npm run build && node test/node-raw-session.mjs

  # Run the source suite on current Node.js 24 and check the minimum release below.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    name: test (${{ matrix.os }}, node)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NODRIVER_HEADFUL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          cache: npm
      # Ubuntu pipes core dumps to systemd-coredump, which holds a crashed renderer for tens of
      # seconds before Chrome sees it exit. Plain core files are skipped (the core size limit is 0).
      - name: Disable piped core dumps
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.core_pattern=core
      - run: npm ci
      # The runner image's Chrome is not pinned; record what this run actually tested.
      - name: Record versions
        shell: bash
        run: |
          mkdir -p test-results
          node test/ci-versions.ts | tee test-results/versions.txt
          { echo '### Versions'; echo '```'; cat test-results/versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run check
      - run: npm run format:check
      - name: Unit tests
        shell: bash
        run: npm test
      # Real-browser tests depend on runner timing; retry once before failing the job. The first
      # attempt's log is kept and its failures are reported, so a passing retry does not hide them.
      - name: Integration tests
        # A leaked fixture can keep Node alive after individual tests time out.
        timeout-minutes: 20
        shell: bash
        run: |
          if npm run test:integration 2>&1 | tee test-results/integration-1.log; then exit 0; fi
          node test/ci-failures.ts test-results/integration-1.log > test-results/integration-1-failures.txt
          while IFS= read -r line; do echo "::warning title=Integration first attempt::${line//%/%25}"; done < test-results/integration-1-failures.txt
          { echo '### Integration first attempt failed'; echo '```'; cat test-results/integration-1-failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npm run test:integration 2>&1 | tee test-results/integration-2.log
      - name: Worker startup capability experiment
        shell: bash
        env:
          WORKER_AUDIT_TRANSPORTS: pipe
        run: node benchmarks/worker-environment.ts > test-results/worker-environment.log 2>&1
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}-node
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Local differential audit (functional checks, no timing thresholds)
        if: runner.os == 'Linux'
        shell: bash
        env:
          AUDIT_REPEATS: '1'
          AUDIT_TRANSPORTS: pipe
          AUDIT_VARIANTS: default-native,default-masked,explicit-environment
        run: node benchmarks/audit.ts > test-results/local-audit.json 2> test-results/local-audit.log
      - name: Upload local audit report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: local-differential-audit
          path: test-results/local-audit.*
          if-no-files-found: ignore
          retention-days: 30
      - name: Built package
        run: npm run test:dist

  # Keep the declared >=24.22.0 floor honest as later 24.x releases add APIs.
  node-24-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - name: Disable piped core dumps for crash acceptance
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Record versions
        run: |
          echo "node $(node --version)"
          google-chrome --version
      - run: npm run test:dist
