name: Browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      NODRIVER_HEADFUL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      # Ubuntu pipes core dumps to systemd-coredump, which holds a crashed renderer for tens of
      # seconds before Chrome sees it exit. Plain core files are skipped (the core size limit is 0).
      - name: Disable piped core dumps
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.core_pattern=core
      - run: bun install --frozen-lockfile
      # The runner image's Chrome is not pinned; record what this run actually tested.
      - name: Record versions
        shell: bash
        run: |
          mkdir -p test-results
          bun -e '
          import { Browser, findExecutable } from "./src/index.ts";
          const path = await findExecutable();
          const browser = await Browser.launch({ headless: true });
          try {
            console.log([
              `os: ${process.platform} ${process.arch}`,
              `bun: ${Bun.version}`,
              `chrome: ${browser.version.product} (${path})`,
              `protocol: ${browser.version.protocolVersion}`,
            ].join("\n"));
          } finally {
            await browser.close();
          }
          ' | tee test-results/versions.txt
          { echo '### Versions'; echo '```'; cat test-results/versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: bun run check
      - run: bun run format:check
      - run: bun run test
      # Real-browser tests depend on runner timing; retry once before failing the job. The first
      # attempt's log is kept and its failures are reported, so a passing retry does not hide them.
      - name: Integration tests
        shell: bash
        run: |
          if bun run test:integration 2>&1 | tee test-results/integration-1.log; then exit 0; fi
          sed 's/\x1b\[[0-9;]*m//g' test-results/integration-1.log | grep '^(fail)' > test-results/integration-1-failures.txt || true
          while IFS= read -r line; do echo "::warning title=Integration first attempt::${line//%/%25}"; done < test-results/integration-1-failures.txt
          { echo '### Integration first attempt failed'; echo '```'; cat test-results/integration-1-failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          bun run test:integration 2>&1 | tee test-results/integration-2.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
      - run: bun run build

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Record versions
        run: |
          echo "bun $(bun --version), node $(node --version)"
          google-chrome --version
      - run: bun run test:node
